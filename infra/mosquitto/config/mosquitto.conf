# Cấu hình Mosquitto cho môi trường phát triển.
# CẢNH BÁO: allow_anonymous true chỉ dùng khi phát triển cục bộ.
# Khi triển khai thật phải bật password_file và TLS (xem docs/04-MQTT-CONTRACT.md §4).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Cổng MQTT chuẩn
listener 1883
protocol mqtt

# Cổng WebSocket (để trình duyệt có thể kết nối trực tiếp nếu cần)
listener 9001
protocol websockets

allow_anonymous true
