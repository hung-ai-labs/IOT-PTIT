<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử thao tác — Smart IoT</title>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body class="history-screen">
  <!-- Device options come from index.html; other filters are editable below. -->
  <template id="historyFiltersTemplate">
<div class="filter-bar">
      <input class="input filter-bar__search" type="search" id="searchInput"
             placeholder="Nhập ngày hoặc giờ cần tìm…" aria-label="Tìm theo thời gian">
      <select class="select" id="targetFilter" aria-label="Lọc theo thiết bị">
      </select>
      <select class="select" id="actionFilter" aria-label="Lọc theo hành động">
        <option value="">Hành động: Tất cả</option>
        <option value="ON">Bật</option>
        <option value="OFF">Tắt</option>
      </select>
      <select class="select" id="resultFilter" aria-label="Lọc theo kết quả">
        <option value="">Kết quả: Tất cả</option>
        <option value="Success">Thành công</option>
        <option value="Failed">Thất bại</option>
        <option value="Timeout">Quá hạn</option>
        <option value="Pending">Đang xử lý</option>
      </select>
      <button type="button" class="btn btn--primary" id="applyFilter">Tìm</button>
      <select class="select" id="sortFilter" aria-label="Sắp xếp">
        <option value="timestamp:desc">Mới nhất</option>
        <option value="timestamp:asc">Cũ nhất</option>
      </select>
      <div class="filter-bar__hint">Định dạng thời gian: HH:mm, HH:mm:ss hoặc DD/MM/YYYY HH:mm</div>
    </div>
  </template>
  <script type="module">
// history.js — S6 Lịch sử thao tác (SRS Hình 3.6)
//
// Lọc và phân trang do backend xử lý (GET /api/v1/device-actions).

import { requireAuth } from './assets/js/auth.js';
import { initLayout } from './assets/js/layout.js';
import { badge, emptyState, pagination, bindPagination, toast } from './assets/js/ui.js';
import { escapeHtml, formatDateTime } from './assets/js/format.js';
import { getDeviceActions, getDeviceOptions } from './assets/js/api.js';

if (requireAuth()) {
  const filterMarkup = document.getElementById('historyFiltersTemplate').innerHTML;
  const content = initLayout('history');
  const deviceOptions = await getDeviceOptions().catch((error) => {
    toast(error.message, 'error');
    return [{ target: '', name: 'Tất cả thiết bị' }];
  });

  const RESULT_BADGE = {
    Success: 'success',
    Failed: 'error',
    Timeout: 'warning',
    Pending: 'muted',
  };

  const filters = { target: '', action: '', result: '', q: '' };
  let page = 1;
  let sort = 'timestamp:desc';
  const perPage = 5;
  let result = { items: [], page: 1, total: 0, totalPages: 1 };

  async function fetchPage() {
    try {
      result = await getDeviceActions({
        target: filters.target,
        action: filters.action,
        result: filters.result,
        q: filters.q,
        page,
        size: perPage,
        sort,
      });
    } catch (error) {
      result = { items: [], page: 1, total: 0, totalPages: 1, error: error.message };
      toast(error.message, 'error');
    }
  }

  function filterBarHtml() {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = filterMarkup;
    const select = wrapper.querySelector('#targetFilter');
    deviceOptions.forEach((option) => select.add(new Option(option.name, option.target)));
    return wrapper.innerHTML;
  }

  function rowsHtml() {
    return result.items.map((record) => {
      const who = record.issued_by?.full_name ?? '— (thiết bị tự đổi)';
       const note = record.error_msg
        ? `<div class="text-muted" style="font-size:var(--text-xs);margin-top:2px">${escapeHtml(record.error_msg)}</div>`
        : '';
      return `
        <tr title="${escapeHtml(formatDateTime(record.timestamp))}">
          <td><span class="mono" style="font-size:var(--text-sm)">${record.id}</span></td>
          <td>${badge('info', record.device_id)}</td>
          <td>${escapeHtml(record.target_label)}</td>
          <td>${badge(record.action === 'ON' ? 'success' : 'muted', record.action === 'ON' ? 'Bật' : 'Tắt')}</td>
          <td>${escapeHtml(who)}</td>
          <td>${badge(RESULT_BADGE[record.result] ?? 'muted', record.result)}${note}</td>
          <td><span class="mono text-secondary" style="font-size:var(--text-sm)">${formatDateTime(record.timestamp)}</span></td>
        </tr>`;
    }).join('');
  }

  function tableHtml() {
    if (result.error) {
      return `<div class="card card--table">${
        emptyState('⚠️', 'Không tải được lịch sử', result.error)}</div>`;
    }

    const body = `<table class="table">
      <thead><tr>
        <th>ID</th><th>Device ID</th><th>Thiết bị</th><th>Hành động</th>
        <th>Người thực hiện</th><th>Kết quả</th><th>Thời gian</th>
      </tr></thead>
      <tbody>${result.items.length ? rowsHtml() : `<tr><td colspan="7">${
        emptyState('🔍', 'Không có thao tác nào', 'Chưa có lịch sử thao tác để hiển thị.')}</td></tr>`}</tbody>
    </table>`;

    return `<div class="card card--table"><div class="history-table-scroll" tabindex="0" aria-label="Danh sách lịch sử thao tác">${body}</div>${
      pagination({ page: result.page, perPage, total: result.total })}</div>`;
  }

  async function renderTable() {
    const wrap = document.getElementById('tableWrap');
    wrap.innerHTML = `<div class="card card--table"><div class="empty-state">
      <div class="empty-state__icon"><span class="spinner"></span></div>
      <div class="empty-state__title">Đang tải...</div></div></div>`;

    await fetchPage();
    wrap.innerHTML = tableHtml();
    bindPagination(wrap, result.totalPages, (next) => { page = next; renderTable(); });
  }

  content.innerHTML = `
    <div class="page page--tight">
      ${filterBarHtml()}
      <div id="tableWrap"></div>
    </div>`;

  const search = document.getElementById('searchInput');

  const apply = () => {
    filters.q = search.value.trim();
    filters.target = document.getElementById('targetFilter').value;
    filters.action = document.getElementById('actionFilter').value;
    filters.result = document.getElementById('resultFilter').value;
    page = 1;
    renderTable();
  };

  document.getElementById('applyFilter').addEventListener('click', apply);
  search.addEventListener('keydown', (event) => { if (event.key === 'Enter') apply(); });
  // Dấu × của <input type="search"> cũng phải tải lại danh sách.
  search.addEventListener('search', apply);
  ['targetFilter', 'actionFilter', 'resultFilter']
    .forEach((id) => document.getElementById(id).addEventListener('change', apply));

  document.getElementById('sortFilter').addEventListener('change', (event) => {
    sort = event.target.value;
    page = 1;
    renderTable();
  });

  renderTable();
}
  </script>
</body>
</html>
